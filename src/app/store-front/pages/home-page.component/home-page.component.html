<h1 class="text-3xl font-bold font-['Montserrat',sans-serif]"> Todos los productos {{paginationService.currentPage()}}</h1>
<h2 class="text-xl mb-5"> Para todos los gustos </h2>

<app-pagination [pages]="productsResource.value()?.pages ?? 0"
[currentPage]="paginationService.currentPage()"
/>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3">
@for(product of productsResource.value()?.products; track $index){
  <product-card [products]="product"/>
}@empty {
  <p> No hay data </p>
}
</div>
